name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hydcraft_portal?schema=public
      NUXT_PUBLIC_SITE_URL: https://hydcraft.example
      JWT_SECRET: ci-demo-jwt-secret
      CONFIG_ENCRYPTION_KEY: ci-demo-config-encryption-key
      HYDCRAFT_DISABLE_PORTAL_BRIDGE: '1'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.14.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
