name: Build and sync to CNB

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hydcraft_portal?schema=public
      NUXT_PUBLIC_SITE_URL: https://hydcraft.example
      JWT_SECRET: ci-demo-jwt-secret
      CONFIG_ENCRYPTION_KEY: ci-demo-config-encryption-key
      HYDCRAFT_DISABLE_PORTAL_BRIDGE: '1'
      CNB_REPOSITORY_SLUG: ${{ vars.CNB_REPOSITORY_SLUG }}
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.14.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Prepare deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
        run: |
          pnpm build:production-init-cli

          rm -rf deploy-artifact hydcraft-portal-deploy.tar.gz
          mkdir -p deploy-artifact/data
          cp package.json pnpm-lock.yaml prisma.config.ts deploy-artifact/
          cp -R dist-cli prisma .output deploy-artifact/
          cp -R data/ip2region deploy-artifact/data/
          pnpm install --prod --frozen-lockfile --dir deploy-artifact

          test -f deploy-artifact/.output/server/index.mjs
          test -f deploy-artifact/dist-cli/scripts/production-init.js
          test -f deploy-artifact/prisma.config.ts
          test -f deploy-artifact/prisma/schema/migrations/migration_lock.toml
          test -f deploy-artifact/node_modules/.bin/prisma

          tar -czf hydcraft-portal-deploy.tar.gz -C deploy-artifact .

      - name: Validate CNB configuration
        if: github.event_name == 'push'
        run: |
          test -n "$CNB_REPOSITORY_SLUG" || {
            echo 'CNB_REPOSITORY_SLUG GitHub Actions variable is required.' >&2
            exit 1
          }
          test -n "$CNB_TOKEN" || {
            echo 'CNB_TOKEN GitHub Actions secret is required.' >&2
            exit 1
          }

      - name: Sync Git refs to CNB
        if: github.event_name == 'push'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e "PLUGIN_TARGET_URL=https://cnb.cool/$CNB_REPOSITORY_SLUG.git" \
            -e 'PLUGIN_AUTH_TYPE=https' \
            -e 'PLUGIN_USERNAME=cnb' \
            -e "PLUGIN_PASSWORD=$CNB_TOKEN" \
            -e 'PLUGIN_FORCE=true' \
            -e 'PLUGIN_PUSH_TAGS=true' \
            tencentcom/git-sync

      - name: Upload deployment artifact to CNB
        if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e "CNB_TOKEN=$CNB_TOKEN" \
            -e 'CNB_API_ENDPOINT=https://api.cnb.cool' \
            -e "CNB_REPO_SLUG=$CNB_REPOSITORY_SLUG" \
            -e "PLUGIN_COMMIT=$GITHUB_SHA" \
            -e 'PLUGIN_ATTACHMENTS=hydcraft-portal-deploy.tar.gz' \
            cnbcool/attachments:latest
