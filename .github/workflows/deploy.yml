name: Deploy

on:
  workflow_dispatch:
    inputs:
      baseline_existing_db:
        description: 'Mark 0_init as already applied before deploy (use only for the first deploy to an existing database)'
        required: false
        default: false
        type: boolean
      run_production_init:
        description: 'Run production init after migrations on the remote host'
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  trigger:
    name: Trigger CNB production deployment
    runs-on: ubuntu-latest
    env:
      CNB_REPOSITORY_SLUG: ${{ vars.CNB_REPOSITORY_SLUG }}
      CNB_API_TOKEN: ${{ secrets.CNB_API_TOKEN }}
      CNB_BRANCH: v2
      BASELINE_EXISTING_DB: ${{ inputs.baseline_existing_db }}
      RUN_PRODUCTION_INIT: ${{ inputs.run_production_init }}
    steps:
      - name: Validate CNB configuration
        run: |
          test -n "$CNB_REPOSITORY_SLUG" || {
            echo 'CNB_REPOSITORY_SLUG GitHub Actions variable is required.' >&2
            exit 1
          }
          test -n "$CNB_API_TOKEN" || {
            echo 'CNB_API_TOKEN GitHub Actions secret is required.' >&2
            exit 1
          }
      - name: Trigger CNB pipeline
        run: |
          payload="$(jq -cn \
            --arg event 'api_trigger_deploy' \
            --arg branch "$CNB_BRANCH" \
            --arg baselineExistingDb "$BASELINE_EXISTING_DB" \
            --arg runProductionInit "$RUN_PRODUCTION_INIT" \
            '{
              event: $event,
              branch: $branch,
              env: {
                BASELINE_EXISTING_DB: $baselineExistingDb,
                RUN_PRODUCTION_INIT: $runProductionInit
              }
            }')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.cnb.cool/$CNB_REPOSITORY_SLUG/-/build/start" \
            --header "Authorization: $CNB_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload" | jq .
