name: Build & Deploy

on:
  workflow_dispatch:
    inputs:
      baseline_existing_db:
        description: 'Mark 0_init as already applied before deploy (use only for the first deploy to an existing database)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      # Required secrets:
      # BACKEND_DEPLOY_HOST
      # BACKEND_DEPLOY_USER
      # BACKEND_DEPLOY_SSH_PRIVATE_KEY
      # BACKEND_PM2_APP_NAME
      # ARTIFACT_BUCKET
      # ARTIFACT_UPLOAD_ENDPOINT
      # ARTIFACT_DOWNLOAD_ENDPOINT
      # COS_ACCESS_KEY_ID
      # COS_SECRET_ACCESS_KEY
      #
      # Optional secrets:
      # BACKEND_DEPLOY_SSH_PORT
      # BACKEND_REMOTE_DEPLOY_PATH
      # ARTIFACT_REGION
      # DEPLOY_RUNTIME_ENV
      SSH_HOST: ${{ secrets.BACKEND_DEPLOY_HOST }}
      SSH_PORT: ${{ secrets.BACKEND_DEPLOY_SSH_PORT || '233' }}
      SSH_USER: ${{ secrets.BACKEND_DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.BACKEND_DEPLOY_SSH_PRIVATE_KEY }}
      REMOTE_DEPLOY_PATH: ${{ secrets.BACKEND_REMOTE_DEPLOY_PATH || '/www/wwwroot/hydcraft-portal' }}
      REMOTE_TEMP_DIR: /tmp/hydcraft-portal-deploy-${{ github.run_id }}-${{ github.run_attempt }}
      PM2_APP_NAME: ${{ secrets.BACKEND_PM2_APP_NAME }}
      ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
      ARTIFACT_UPLOAD_ENDPOINT: ${{ secrets.ARTIFACT_UPLOAD_ENDPOINT }}
      ARTIFACT_DOWNLOAD_ENDPOINT: ${{ secrets.ARTIFACT_DOWNLOAD_ENDPOINT }}
      ARTIFACT_REGION: ${{ secrets.ARTIFACT_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.COS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.COS_SECRET_ACCESS_KEY }}
      DEPLOY_RUNTIME_ENV: ${{ secrets.DEPLOY_RUNTIME_ENV }}

    steps:
      - uses: actions/checkout@v4

      - name: Build app in Docker
        run: |
          docker run --rm \
            -e DEPLOY_RUNTIME_ENV="$DEPLOY_RUNTIME_ENV" \
            -v "$GITHUB_WORKSPACE":/app \
            -w /app \
            node:24-bookworm \
            bash -lc '
              set -euo pipefail
              corepack enable
              corepack prepare pnpm@10.14.0 --activate
              pnpm install --frozen-lockfile
              pnpm exec prisma generate

              if [ -n "$DEPLOY_RUNTIME_ENV" ]; then
                printf "%s\n" "$DEPLOY_RUNTIME_ENV" > .env
              fi

              pnpm build

              rm -rf /app/deploy-artifact
              pnpm deploy --prod /app/deploy-artifact

              cp -R /app/.output/public \
                    /app/.output/server \
                    /app/deploy-artifact/
              mkdir -p /app/deploy-artifact/server/data
              cp -R /app/data/ip2region /app/deploy-artifact/server/data/
              cp -R /app/prisma /app/deploy-artifact/prisma
              cp /app/.output/nitro.json /app/deploy-artifact/nitro.json
              cp /app/package.json /app/pnpm-lock.yaml /app/prisma.config.ts /app/deploy-artifact/

              test -f /app/deploy-artifact/package.json
              test -f /app/deploy-artifact/prisma.config.ts
              test -f /app/deploy-artifact/prisma/migrations/migration_lock.toml
              test -f /app/deploy-artifact/node_modules/.bin/prisma
            '

      - name: Install COSCMD
        run: python3 -m pip install -U coscmd

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh/cm
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

          cat >> ~/.ssh/config <<EOF
          Host deploy-host
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            ControlMaster auto
            ControlPersist 5m
            ControlPath ~/.ssh/cm/%r@%h:%p
            ServerAliveInterval 10
            ServerAliveCountMax 3
            ConnectTimeout 30
          EOF

      - name: Warm up SSH connection
        run: |
          ssh deploy-host "echo SSH warmup OK"

      - name: Create remote temp dir
        run: |
          ssh deploy-host "mkdir -p '$REMOTE_TEMP_DIR'"

      - name: Pack deploy artifact
        run: |
          tar -czf deploy-artifact.tar.gz -C deploy-artifact .

      - name: Upload deploy artifact
        run: |
          set -euo pipefail
          coscmd config -a "$AWS_ACCESS_KEY_ID" -s "$AWS_SECRET_ACCESS_KEY" -b "$ARTIFACT_BUCKET" -e "$ARTIFACT_UPLOAD_ENDPOINT" -m 20 --retry 10 --timeout 120
          coscmd delete -r --yes hydcraft-portal/ || true
          coscmd upload --yes deploy-artifact.tar.gz "hydcraft-portal/deploy-artifact-${{ github.run_id }}.tar.gz"

      - name: Deploy app on remote host
        run: |
          ssh deploy-host <<EOF
          set -euo pipefail

          export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
          export ARTIFACT_BUCKET="$ARTIFACT_BUCKET"
          export ARTIFACT_DOWNLOAD_ENDPOINT="$ARTIFACT_DOWNLOAD_ENDPOINT"
          export ARTIFACT_REGION="$ARTIFACT_REGION"
          export REMOTE_DEPLOY_PATH="$REMOTE_DEPLOY_PATH"
          export REMOTE_TEMP_DIR="$REMOTE_TEMP_DIR"
          export PM2_APP_NAME="$PM2_APP_NAME"
          export DEPLOY_RUNTIME_ENV="$DEPLOY_RUNTIME_ENV"
          export BASELINE_EXISTING_DB="${{ github.event.inputs.baseline_existing_db || 'false' }}"

          mkdir -p "$REMOTE_DEPLOY_PATH"

          coscmd config -a "$AWS_ACCESS_KEY_ID" -s "$AWS_SECRET_ACCESS_KEY" -b "$ARTIFACT_BUCKET" -e "$ARTIFACT_DOWNLOAD_ENDPOINT" -m 20 --retry 10 --timeout 120
          rm -f "$REMOTE_TEMP_DIR/deploy-artifact.tar.gz"
          coscmd download -f "hydcraft-portal/deploy-artifact-${{ github.run_id }}.tar.gz" "$REMOTE_TEMP_DIR/deploy-artifact.tar.gz"

          rm -rf "$REMOTE_TEMP_DIR/extracted"
          mkdir -p "$REMOTE_TEMP_DIR/extracted"
          tar -xzf "$REMOTE_TEMP_DIR/deploy-artifact.tar.gz" -C "$REMOTE_TEMP_DIR/extracted"

          if [ -n "$DEPLOY_RUNTIME_ENV" ]; then
            printf "%s\n" "$DEPLOY_RUNTIME_ENV" > "$REMOTE_DEPLOY_PATH/.env"
          fi

          rsync -a --no-owner --no-group --delete --exclude='.env' \
            "$REMOTE_TEMP_DIR/extracted/" \
            "$REMOTE_DEPLOY_PATH/"

          cd "$REMOTE_DEPLOY_PATH"
          set -a
          source ./.env
          set +a

          if [ "$BASELINE_EXISTING_DB" = "true" ]; then
            pnpm prisma migrate resolve --applied 0_init
          fi

          pnpm prisma:deploy

          if pm2 describe "$PM2_APP_NAME" >/dev/null 2>&1; then
            pm2 restart "$PM2_APP_NAME" --update-env
          else
            pm2 start "$REMOTE_DEPLOY_PATH/server/index.mjs" --name "$PM2_APP_NAME" --cwd "$REMOTE_DEPLOY_PATH"
          fi

          pm2 save

          rm -rf "$REMOTE_TEMP_DIR"
          EOF
