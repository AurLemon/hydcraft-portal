v2:
  web_trigger_deploy:
    - &production_deploy
      name: 构建并部署生产环境
      docker:
        image: node:24-bookworm
      imports:
        - https://cnb.cool/HydCraft/hydcraft-secrets/-/blob/main/hydcraft-portal-deploy.yml
      stages:
        - name: Build
          script: |
            set -euo pipefail
            apt-get update
            apt-get install -y --no-install-recommends openssh-client rsync
            rm -rf /var/lib/apt/lists/*

            export DATABASE_URL="${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/hydcraft_portal?schema=public}"
            export NUXT_PUBLIC_SITE_URL="${NUXT_PUBLIC_SITE_URL:-https://hydcraft.example}"
            export JWT_SECRET="${JWT_SECRET:-ci-demo-jwt-secret}"
            export CONFIG_ENCRYPTION_KEY="${CONFIG_ENCRYPTION_KEY:-ci-demo-config-encryption-key}"
            export HYDCRAFT_DISABLE_PORTAL_BRIDGE="${HYDCRAFT_DISABLE_PORTAL_BRIDGE:-1}"

            corepack enable
            corepack prepare pnpm@10.14.0 --activate
            pnpm install --frozen-lockfile
            pnpm build:production-init-cli
            pnpm build

            rm -rf deploy-artifact
            mkdir -p deploy-artifact/data
            cp package.json pnpm-lock.yaml prisma.config.ts deploy-artifact/
            cp -R dist-cli prisma .output deploy-artifact/
            cp -R data/ip2region deploy-artifact/data/
            pnpm install --prod --frozen-lockfile --dir deploy-artifact

            test -f deploy-artifact/.output/server/index.mjs
            test -f deploy-artifact/dist-cli/scripts/production-init.js
            test -f deploy-artifact/prisma.config.ts
            test -f deploy-artifact/prisma/schema/migrations/migration_lock.toml
            test -f deploy-artifact/node_modules/.bin/prisma

        - name: Deploy
          script: bash ./.cnb/scripts/deploy-production.sh

  api_trigger_deploy:
    - <<: *production_deploy
      name: API 构建并部署生产环境
