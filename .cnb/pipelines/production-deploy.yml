v2:
  web_trigger_deploy:
    - &production_deploy
      name: 部署生产环境
      docker:
        image: docker:27-cli
      services:
        - docker
      imports:
        - https://cnb.cool/HydCraft/hydcraft-secrets/-/blob/main/hydcraft-portal-deploy.yml
      stages:
        - name: Download GitHub build artifact
          script: |
            set -euo pipefail
            apk add --no-cache bash openssh-client rsync
            rm -rf deploy-artifact hydcraft-portal-deploy.tar.gz
            docker run --rm \
              -v "$PWD:$PWD" \
              -w "$PWD" \
              -e "CNB_TOKEN=$CNB_TOKEN" \
              -e 'CNB_API_ENDPOINT=https://api.cnb.cool' \
              -e "CNB_REPO_SLUG=$CNB_REPO_SLUG" \
              -e "PLUGIN_COMMIT=$CNB_COMMIT" \
              -e 'PLUGIN_TYPE=DOWNLOAD' \
              -e 'PLUGIN_ATTACHMENTS=hydcraft-portal-deploy.tar.gz' \
              cnbcool/attachments:latest
            mkdir -p deploy-artifact
            tar -xzf hydcraft-portal-deploy.tar.gz -C deploy-artifact
            test -f deploy-artifact/.output/server/index.mjs

        - name: Deploy artifact
          script: bash ./.cnb/scripts/deploy-production.sh

  api_trigger_deploy:
    - <<: *production_deploy
      name: API 部署生产环境
